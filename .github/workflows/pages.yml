# Release assets の wheel から PEP 503 simple index を組んで GitHub Pages に配る。
# wheel 本体は git 履歴に入れない (Release asset)。index 自体は releases API だけから
# 生成できるが、GPL-3.0 §6(d) が要求する「object code の隣に置くソースの在処」を index に
# 載せるため thirdparty-license/NOTICE の1ファイルだけ sparse checkout する (文言を
# workflow に直書きすると README/Release と食い違うため)。Pages は build_type=workflow 設定済み。
# 消費側: [[tool.uv.index]] url = "https://lzpel.github.io/openmc-anywhere/wheel/"
name: pages
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: thirdparty-license/NOTICE
          sparse-checkout-cone-mode: false
      - name: generate simple index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/wheel/openmc-anywhere
          # プレフィックスで絞るのは、改名前の配布名で作られた wheel (openmc_pypi-*.whl) が
          # 同じ Release にぶら下がったままのため。openmc-anywhere の project page に
          # 別配布名の wheel を載せてはいけない (PEP 503)。
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[].assets[] | select(.name | startswith("openmc_anywhere-") and endswith(".whl")) | .browser_download_url' > urls.txt
          test -s urls.txt   # wheel ゼロの index を配らない (release より先に手動起動した場合の防波堤)
          {
            echo '<!DOCTYPE html><html><head><meta name="pypi:repository-version" content="1.0"></head><body>'
            while read -r u; do printf '<a href="%s">%s</a><br>\n' "$u" "$(basename "$u")"; done < urls.txt
            # NOTICE は < > & を含まない前提で pre に素通しする (エスケープ不要)。
            echo '<hr><pre>'
            cat thirdparty-license/NOTICE
            echo '</pre></body></html>'
          } > site/wheel/openmc-anywhere/index.html
          echo '<!DOCTYPE html><html><body><a href="openmc-anywhere/">openmc-anywhere</a></body></html>' \
            > site/wheel/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
