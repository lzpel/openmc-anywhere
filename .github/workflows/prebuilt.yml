# prebuilt ブランチへの push で全 TARGET の wheel をビルドし、GitHub Release にまとめて
# 公開する (github.com/lzpel/cadrum の prebuilt パイプラインの方式)。
#
# - 全 TARGET を docker cross (linux 2 arch + windows + darwin 2 arch): `make cross-<triple>`
#   が docker/Dockerfile_<triple> を組んで中で wheel を作る。環境依存はイメージに閉じる。
#   aarch64-linux は ubuntu-24.04-arm ランナーでネイティブ実行 (QEMU 回避)。
#   darwin は osxcross、windows-gnu は mingw-w64 のクロスなので ubuntu ランナーで良い
#   (cadrum の prebuilt と同方式)。MSYS2 の CI 化は make の CURDIR が POSIX パスになり
#   native cmake が解釈できず破綻した (run 29983656072) ため廃止。
# - release ジョブ: 全 wheel を Release v<version> (pyproject.toml) に添付。既存タグなら
#   asset を差し替える (softprops の挙動。CI 再実行で同版を更新できる)。Release を作る
#   経路はここだけ (makefile に手動 release は持たせない)。
# - 注意: デフォルト GITHUB_TOKEN で作った Release は release:published イベントを
#   発火しない (GitHub の再帰防止仕様) ため、pages.yml は workflow_dispatch で明示起動する。
name: prebuilt
on:
  push:
    branches: [prebuilt]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-gnu,     os: ubuntu-latest }
          - { target: x86_64-apple-darwin,       os: ubuntu-latest }
          - { target: aarch64-apple-darwin,      os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      # submodule 指定は不要: make src がコンテナ内で update --init --recursive する
      - uses: actions/checkout@v4
      - run: make cross-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Release 作成
      actions: write    # pages.yml の workflow_dispatch
    steps:
      - uses: actions/checkout@v4   # pyproject.toml の version を読むだけ
      - id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # wheel の一次配布点は Release asset なので、GPL-3.0 §6(d) の「object code の隣に
      # 置くソースの在処」は本文に載せる。文言は thirdparty-license/NOTICE が単一の正。
      - run: |
          { echo 'openmc + libopenmc + njoy bundled wheels'; echo; cat thirdparty-license/NOTICE; } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          body_path: release-body.md
          files: dist/*.whl
      # pages.yml は default ブランチの定義が起動される (-r 指定なし) ので、
      # prebuilt ブランチからの起動でも正しい index 生成が走る
      - name: trigger pages index rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY"
