# 配布名は openmc-pypi、import 名は上流そのままの openmc (cadquery-ocp が OCP を提供するのと
# 同じ関係)。上流の pyproject.toml は使わない: setuptools-scm の dynamic version が submodule の
# git メタデータ (タグ) を要求するのに対し、こちらは静的に固定できるため。依存は上流
# src/openmc/pyproject.toml の dependencies を verbatim に写す。
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openmc-pypi"
# 上流 v0.15.3-214-g54b661d39 (submodule の pin) に対応。submodule を進めたら手で更新する
version = "0.15.3.post214"
description = "OpenMC Monte Carlo particle transport with bundled binaries (openmc executable + libopenmc shared library)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy",
    "h5py",
    "scipy",
    "ipython",
    "matplotlib",
    "pandas",
    "lxml",
    "uncertainties",
    "endf",
]

[project.urls]
Repository = "https://github.com/lzpel/openmc-pypi"
Upstream = "https://github.com/openmc-dev/openmc"

[tool.hatch.build.targets.wheel]
# 末尾の path 成分がそのまま import パッケージ名になる → openmc
packages = ["src/openmc/openmc"]
# hatchling は submodule 内の .gitignore を適用しない (実測: *.a も *.dll も素通り) ので、
# ビルド産物の混入をここで締め出す: 静的 archive (exe ビルドの POST_BUILD が落とす
# liblibopenmc.a) と共有ライブラリ両方。共有 lib は win/linux/mac の全 TARGET がソース
# ツリーを共有するため他ターゲットの残骸があり得る。現ターゲットの正しい1つだけを
# hatch_build.py の force_include (exclude より優先) が out/<triple>/ から戻す
exclude = ["*.a", "*.dll", "*.so", "*.dylib"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
